name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx neu update
      - run: npm run build
      - name: Zip portable app
        run: cd dist/mdink-win && zip -r ../mdink-win-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: mdink-win-x64
          path: dist/mdink-win
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/mdink-win-x64.zip
